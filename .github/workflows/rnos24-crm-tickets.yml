name: RNOS-24 CRM Tickets Gate

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/tickets/**'
      - 'scripts/playwright_ops_crm_tickets_e2e.sh'
      - 'scripts/rnos24_*.sh'
      - 'ptt.db'
      - '.github/workflows/rnos24-crm-tickets.yml'
  push:
    branches: [main]
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/tickets/**'
      - 'scripts/playwright_ops_crm_tickets_e2e.sh'
      - 'scripts/rnos24_*.sh'
      - '.github/workflows/rnos24-crm-tickets.yml'

concurrency:
  group: rnos24-tickets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-tickets-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/ops-web/package-lock.json
            services/ptt-crm-api/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run RNOS-24 CRM tickets gate
        run: |
          chmod +x scripts/rnos24_crm_tickets_gate.sh scripts/playwright_ops_crm_tickets_e2e.sh
          bash scripts/rnos24_crm_tickets_gate.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnos24-crm-tickets-gate-artifacts
          path: |
            .local-dev/rnos24-crm-tickets-gate-report.json
            services/ops-web/test-results/
            services/ops-web/playwright-report/
          if-no-files-found: ignore
