name: RNOS-M3 Mobile Shell

on:
  push:
    paths:
      - 'services/mobile-shell/**'
      - 'services/portal-web/src/**/capacitor/**'
      - 'services/portal-web/src/lib/capacitor*.ts'
      - 'services/portal-web/src/hooks/useCapacitor*.ts'
      - 'scripts/rnos_m3_phase1_gate.sh'
      - 'scripts/m3_mobile_shell_*.sh'
  pull_request:
    paths:
      - 'services/mobile-shell/**'
      - 'services/portal-web/src/**/capacitor/**'
      - 'services/portal-web/src/lib/capacitor*.ts'
      - 'scripts/rnos_m3_phase1_gate.sh'
  workflow_dispatch:

jobs:
  phase1-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/mobile-shell/package-lock.json
            services/portal-web/package-lock.json
      - name: RNOS-M3 Phase 1 gate
        run: bash scripts/rnos_m3_phase1_gate.sh

  android-sync:
    runs-on: ubuntu-latest
    needs: phase1-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK (minimal)
        run: |
          echo "Skipping full SDK — run cap add android locally for store builds"
          cd services/mobile-shell
          npm install
          npm run build:www
          npx tsc --noEmit

  ios-build-www:
    runs-on: macos-latest
    needs: phase1-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shell bootstrap (macOS)
        run: |
          cd services/mobile-shell
          npm install
          npm run build:www
          npm run typecheck
