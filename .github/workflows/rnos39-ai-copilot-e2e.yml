name: RNOS-39 AI Copilot E2E

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/ai-intelligence/**'
      - 'services/ptt-crm-api/src/staff-auth/**'
      - 'scripts/playwright_ops_ai_copilot_e2e.sh'
      - 'scripts/rnos39_*.sh'
      - 'deploy/env.ai.example'
      - 'ptt.db'
      - '.github/workflows/rnos39-ai-copilot-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/ai-intelligence/**'
      - 'scripts/playwright_ops_ai_copilot_e2e.sh'
      - 'scripts/rnos39_*.sh'
      - '.github/workflows/rnos39-ai-copilot-e2e.yml'

concurrency:
  group: rnos39-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-copilot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ptt
          POSTGRES_PASSWORD: ptt_dev
          POSTGRES_DB: rnosaidb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ptt -d rnosaidb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ptt:ptt_dev@127.0.0.1:5433/rnosaidb
      PTT_LEADS_READ_SOURCE: pg
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      OPS_E2E_AI_LEAD_ID: '9000050'
      RNOS39_SKIP_BOOTSTRAP: '0'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/ops-web/package-lock.json
            services/ptt-crm-api/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y postgresql-client python3

      - name: Bootstrap DB (v3 + AI DDL + seed)
        run: |
          chmod +x scripts/rnos39_e2e_bootstrap.sh
          # Map GHA postgres to rnosai guard expectations
          export RNOS39_ENV=deploy/env.local.example
          bash scripts/rnos39_e2e_bootstrap.sh

      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run AI Copilot E2E
        run: |
          chmod +x scripts/playwright_ops_ai_copilot_e2e.sh
          export RNOS39_SKIP_BOOTSTRAP=1
          bash scripts/playwright_ops_ai_copilot_e2e.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnos39-playwright-artifacts
          path: |
            services/ops-web/test-results/
            services/ops-web/playwright-report/
            .local-dev/rnos39-e2e-report.json
          if-no-files-found: ignore
