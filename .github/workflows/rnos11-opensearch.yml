name: RNOS-11 OpenSearch Global Search Gate

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/crm-search/**'
      - 'scripts/rnos11_*.sh'
      - 'scripts/playwright_ops_global_search_e2e.sh'
      - '.github/workflows/rnos11-opensearch.yml'
  push:
    branches: [main]
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/crm-search/**'
      - 'scripts/rnos11_*.sh'
      - 'scripts/playwright_ops_global_search_e2e.sh'
      - '.github/workflows/rnos11-opensearch.yml'

jobs:
  opensearch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/ops-web/package-lock.json
            services/ptt-crm-api/package-lock.json
      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Run RNOS-11 gate
        run: |
          chmod +x scripts/rnos11_opensearch_gate.sh scripts/playwright_ops_global_search_e2e.sh
          bash scripts/rnos11_opensearch_gate.sh
