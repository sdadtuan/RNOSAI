name: RNOS-M3 Phase 4 GA store

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/runbooks/m3-phase4-ga-store-checklist.md'
      - 'docs/runbooks/m3-sentry-native-webview-monitoring.md'
      - 'deploy/env.m3-ga-prod.example'
      - 'scripts/rnos_m3_phase4_gate.sh'
      - 'scripts/m3_ga_*.sh'
      - 'scripts/m3_store_ga_*.sh'
      - 'services/portal-web/src/lib/sentry.client.ts'
      - 'services/mobile-shell/fastlane/Fastfile'

jobs:
  phase4-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 4 GA gate
        run: |
          chmod +x scripts/*.sh
          SKIP_IOS_BUILD=1 SKIP_ANDROID_BUILD=1 RUN_DEEPLINK_SMOKE=0 bash scripts/rnos_m3_phase4_gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rnos-m3-phase4-gate-report
          path: .local-dev/rnos-m3-phase4-gate-report.json
