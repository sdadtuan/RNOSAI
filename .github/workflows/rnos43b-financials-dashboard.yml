name: RNOS-43B Financials Dashboard v2 Gate

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'scripts/playwright_ops_financials_dashboard_v2_e2e.sh'
      - 'scripts/rnos43b_*.sh'
      - '.github/workflows/rnos43b-financials-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'services/ops-web/**'
      - 'scripts/playwright_ops_financials_dashboard_v2_e2e.sh'
      - 'scripts/rnos43b_*.sh'
      - '.github/workflows/rnos43b-financials-dashboard.yml'

concurrency:
  group: rnos43b-financials-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financials-dashboard-v2-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ops-web/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run RNOS-43B Financials dashboard gate
        run: |
          chmod +x scripts/rnos43b_financials_dashboard_gate.sh scripts/playwright_ops_financials_dashboard_v2_e2e.sh
          bash scripts/rnos43b_financials_dashboard_gate.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnos43b-financials-dashboard-gate-artifacts
          path: |
            .local-dev/rnos43b-financials-dashboard-gate-report.json
            services/ops-web/test-results/
            services/ops-web/playwright-report/
          if-no-files-found: ignore
