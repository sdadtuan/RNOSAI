name: Gate R1 Prod Pilot

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/ai-intelligence/**'
      - 'scripts/rnos_r1_*.sh'
      - 'scripts/rnos39_*.sh'
      - 'scripts/rnos40_*.sh'
      - 'scripts/playwright_ops_ai_copilot_e2e.sh'
      - 'deploy/env.ai.example'
      - 'deploy/pilot-cohort.example.json'
      - 'deploy/r1-signoff.template.json'
      - 'docs/runbooks/rnos-r1-prod-pilot-gate.md'
      - 'ptt.db'
      - '.github/workflows/rnos-r1-prod-pilot-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/rnos_r1_*.sh'
      - 'scripts/rnos39_*.sh'
      - 'scripts/rnos40_*.sh'
      - '.github/workflows/rnos-r1-prod-pilot-gate.yml'

concurrency:
  group: rnos-r1-prod-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r1-prod-pilot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ptt
          POSTGRES_PASSWORD: ptt_dev
          POSTGRES_DB: rnosaidb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ptt -d rnosaidb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ptt:ptt_dev@127.0.0.1:5433/rnosaidb
      PTT_LEADS_READ_SOURCE: pg
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      OPS_E2E_AI_LEAD_ID: '9000050'
      RNOS39_SKIP_BOOTSTRAP: '0'
      R1_ENV: deploy/env.local.example
      PTT_AI_LOG_PII: '0'
      PTT_AI_LOG_PROMPTS: '0'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/ops-web/package-lock.json
            services/ptt-crm-api/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y postgresql-client python3

      - name: Bootstrap DB (v3 + AI DDL + seed)
        run: |
          chmod +x scripts/rnos39_e2e_bootstrap.sh
          export RNOS39_ENV=deploy/env.local.example
          bash scripts/rnos39_e2e_bootstrap.sh

      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Gate R1 prod pilot orchestrator
        run: |
          chmod +x scripts/rnos_r1_prod_pilot_gate.sh
          chmod +x scripts/rnos_r1_metrics_probe.sh
          chmod +x scripts/rnos_r1_pilot_enable.sh
          chmod +x scripts/rnos39_gate.sh
          chmod +x scripts/rnos40_gate.sh
          export RNOS39_SKIP_BOOTSTRAP=1
          bash scripts/rnos_r1_prod_pilot_gate.sh

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnos-r1-prod-pilot-gate-artifacts
          path: |
            .local-dev/rnos-r1-prod-pilot-gate-report.json
            .local-dev/rnos39-gate-report.json
            .local-dev/rnos40-gate-report.json
            .local-dev/rnos-r1-metrics-probe.json
            services/ops-web/test-results/
            services/ops-web/playwright-report/
          if-no-files-found: ignore
