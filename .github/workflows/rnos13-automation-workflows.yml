name: RNOS-13 Automation Workflows Gate

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/automation-workflows/**'
      - 'services/ptt-crm-api/src/staff-auth/**'
      - 'scripts/playwright_ops_automation_workflows_e2e.sh'
      - 'scripts/rnos13_*.sh'
      - '.github/workflows/rnos13-automation-workflows.yml'
  push:
    branches: [main]
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/automation-workflows/**'
      - 'services/ptt-crm-api/src/staff-auth/**'
      - 'scripts/playwright_ops_automation_workflows_e2e.sh'
      - 'scripts/rnos13_*.sh'
      - '.github/workflows/rnos13-automation-workflows.yml'

concurrency:
  group: rnos13-automation-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-workflows-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/ops-web/package-lock.json
            services/ptt-crm-api/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run RNOS-13 automation workflows gate
        run: |
          chmod +x scripts/rnos13_automation_workflows_gate.sh scripts/playwright_ops_automation_workflows_e2e.sh
          bash scripts/rnos13_automation_workflows_gate.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnos13-automation-workflows-gate-artifacts
          path: |
            .local-dev/rnos13-automation-workflows-gate-report.json
            services/ops-web/test-results/
            services/ops-web/playwright-report/
          if-no-files-found: ignore
