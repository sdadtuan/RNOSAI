name: UI-R1-09 Admin AI Runs Gate

on:
  pull_request:
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/ai-intelligence/**'
      - 'services/ptt-crm-api/src/staff-auth/**'
      - 'scripts/playwright_ops_admin_ai_runs_e2e.sh'
      - 'scripts/ui_r1_09_*.sh'
      - '.github/workflows/ui-r1-09-admin-ai-runs.yml'
  push:
    branches: [main]
    paths:
      - 'services/ops-web/**'
      - 'services/ptt-crm-api/src/ai-intelligence/**'
      - 'services/ptt-crm-api/src/staff-auth/**'
      - 'scripts/playwright_ops_admin_ai_runs_e2e.sh'
      - 'scripts/ui_r1_09_*.sh'
      - '.github/workflows/ui-r1-09-admin-ai-runs.yml'

concurrency:
  group: ui-r1-09-admin-ai-runs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ai-runs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PTT_SQLITE_PATH: ${{ github.workspace }}/ptt.db
      OPS_E2E_URL: http://127.0.0.1:3200
      OPS_E2E_API_URL: http://127.0.0.1:3000
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/ops-web/package-lock.json
            services/ptt-crm-api/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Install Playwright Chromium
        working-directory: services/ops-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run UI-R1-09 admin AI runs gate
        run: |
          chmod +x scripts/ui_r1_09_admin_ai_runs_gate.sh scripts/playwright_ops_admin_ai_runs_e2e.sh
          bash scripts/ui_r1_09_admin_ai_runs_gate.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-r1-09-admin-ai-runs-gate-artifacts
          path: |
            .local-dev/ui-r1-09-admin-ai-runs-gate-report.json
            services/ops-web/test-results/
            services/ops-web/playwright-report/
          if-no-files-found: ignore
