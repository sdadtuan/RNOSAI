name: CRM No-SQLite Gate

on:
  pull_request:
    paths:
      - 'services/ptt-crm-api/src/**'
      - 'scripts/crm_no_sqlite_gate.sh'
      - '.github/workflows/crm-no-sqlite-gate.yml'
  push:
    branches: [main]
    paths:
      - 'services/ptt-crm-api/src/**'
      - 'scripts/crm_no_sqlite_gate.sh'
      - '.github/workflows/crm-no-sqlite-gate.yml'

concurrency:
  group: crm-no-sqlite-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-no-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: CRM no-SQLite gate
        run: |
          chmod +x scripts/crm_no_sqlite_gate.sh
          ./scripts/crm_no_sqlite_gate.sh
