# VPS overlay — Keycloak behind https://rs.pttads.vn/auth/
services:
  keycloak:
    container_name: rnosai-keycloak
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm --http-port=8080 --http-relative-path=/auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
      KC_HOSTNAME: rs.pttads.vn
      KC_HOSTNAME_PATH: /auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT_HTTPS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/keycloak/realm-ptt-portal.json:/opt/keycloak/data/import/realm-ptt-portal.json:ro
      - ./deploy/keycloak/realm-ptt-staff.json:/opt/keycloak/data/import/realm-ptt-staff.json:ro
    restart: unless-stopped
