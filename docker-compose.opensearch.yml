# Optional OpenSearch for RNOS-11 local dev
# Usage: docker compose -f docker-compose.opensearch.yml up -d
# Then: export OPENSEARCH_URL=http://127.0.0.1:9200

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: rnosai-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - rnosai_opensearch_data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: rnosai-opensearch-dashboards
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    ports:
      - '5601:5601'

volumes:
  rnosai_opensearch_data:
