# RNOS-41 — Optional nginx snippet for rs.pttads.vn
# Prevent stale service worker after deploy. Merge into server block BEFORE location /.
#
#   include /var/www/ptt/deploy/nginx-pwa-sw-cache.snippet.conf;

location = /sw.js {
    proxy_pass http://ptt_ops_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /manifest.webmanifest {
    proxy_pass http://ptt_ops_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
}
