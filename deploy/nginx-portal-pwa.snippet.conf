# RNOS-M2 — Optional nginx snippet for portal.pttads.vn PWA assets
# Merge into server block BEFORE location /.
#
#   include /var/www/ptt/deploy/nginx-portal-pwa.snippet.conf;

location = /sw.js {
    proxy_pass http://ptt_portal_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /manifest.webmanifest {
    proxy_pass http://ptt_portal_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
}
