  <text x="20" y="162" class="ts">Service Delivery</text>
  <!-- Main -->
  <rect x="180" y="48" width="940" height="592" fill="#f8fafc"/>
  <text x="200" y="78" class="ts">CRM › Video SOP › #42 › Gate 2</text>
  <text x="200" y="102" class="t" font-size="18" font-weight="700">Gate Review (SC-10)</text>
  <text x="200" y="122" class="ts">/crm/video/42/gates/2</text>
  <!-- Banner -->
  <rect x="200" y="134" width="880" height="36" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="214" y="157" class="ts">S5 — Gate 2 keyframe · AC-R3 animating</text>
  <!-- Body card -->
  <rect x="200" y="182" width="880" height="440" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  
  <rect x="220" y="210" width="600" height="24" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="226" y="226" class="t" font-size="10" font-weight="600">Checklist</text>
<text x="706" y="226" class="t" font-size="10" font-weight="600">OK</text>
<rect x="220" y="234" width="600" height="22" fill="#fff" stroke="#cbd5e1"/>
<text x="226" y="249" class="ts" font-size="10">Mọi shot có ≥1 keyframe succeeded</text>
<text x="706" y="249" class="ts" font-size="10">✓</text>
<rect x="220" y="256" width="600" height="22" fill="#fff" stroke="#cbd5e1"/>
<text x="226" y="271" class="ts" font-size="10">Không shot keyframe_pending</text>
<text x="706" y="271" class="ts" font-size="10">✓</text>
<rect x="220" y="278" width="600" height="22" fill="#fff" stroke="#cbd5e1"/>
<text x="226" y="293" class="ts" font-size="10">Stage ≥ animating_ready</text>
<text x="706" y="293" class="ts" font-size="10">✗</text>
  
  <rect x="220" y="310" width="90" height="32" rx="4" fill="#2563eb" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="232" y="331" fill="#fff" font-size="11" font-weight="600">Approve</text>
  
  <rect x="320" y="310" width="80" height="32" rx="4" fill="#2563eb"/>
  <text x="332" y="331" fill="#fff" font-size="11" font-weight="600">Reject</text>
  <rect x="220" y="355" width="400" height="50" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <text x="230" y="375" class="ts">Reject reason</text>
  <rect x="230" y="385" width="12" height="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="250" y="395" class="ts">Override (bỏ qua checklist)</text>
  <text x="220" y="430" class="ts">Gate 1: shotlist · Gate 3: clip_selected · Gate 4: QC auto</text>

  <!-- Footer note -->
