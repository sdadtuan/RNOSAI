<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .t { fill: #0f172a; font-size: 13px; }
      .ts { fill: #64748b; font-size: 11px; }
      .tb { fill: #fff; font-size: 12px; font-weight: 600; }
      .hl { fill: #dc2626; font-size: 10px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1120" height="640" fill="#f8fafc"/>
  <!-- Top shell -->
  <rect x="0" y="0" width="1120" height="48" fill="#0f172a"/>
  <text x="20" y="30" class="tb">RNOSAI · ops-web</text>
  <text x="820" y="30" class="tb" font-size="11" opacity="0.85">rs.pttads.vn</text>
  <!-- Sidebar hint -->
  <rect x="0" y="48" width="180" height="592" fill="#f1f5f9"/>
  <text x="20" y="80" class="ts">CRM</text>
  <rect x="12" y="92" width="156" height="28" rx="4" fill="#dbeafe"/>
  <text x="24" y="111" class="t" font-weight="600">Video SOP</text>
